<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDS / IPS Security System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <header class="header-content">
            <h1>IDS / IPS <span class="blue-text">SECURITY SYSTEM</span></h1>
            <div class="glow-line-main"></div><b>
            <p class="subtitle">Intrusion Detection & Prevention</p></b>
        </header>

        <div class="auth-card">
            <div class="card-section top-section">
                <h2 class="form-title">Create Your Account</h2>
                <div class="overlap-glow top-glow"></div>
            </div>

            <div class="card-section form-section">
                <form>
                    <div class="input-group">
                        <div class="icon-container"><i class="fa-regular fa-user"></i></div>
                        <input type="text" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <div class="icon-container"><i class="fa-regular fa-envelope"></i></div>
                        <input type="email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <div class="icon-container"><i class="fa-solid fa-lock"></i></div>
                        <input type="password" placeholder="Password">
                    </div>
                    <div class="input-group">
                        <div class="icon-container"><i class="fa-solid fa-lock"></i></div>
                        <input type="password" placeholder="Confirm Password">
                    </div>

                    <div class="checkbox-row">
                        <div class="custom-checkbox">
                            <input type="checkbox" id="agree" checked>
                            <span class="checkmark"></span>
                        </div>
                        <label for="agree">I agree to the <a href="#" class="accent-blue">Terms of Service</a> and <a href="#" class="accent-blue">Privacy Policy</a></label>
                    </div>

                    <div class="btn-container">
                        <button type="submit" class="signup-btn">Sign Up</button>
                    </div>
                </form>
            </div>

            <div class="card-section footer-section">
                <div class="overlap-glow bottom-glow"></div>
                <div class="footer-content">
                    <p class="warning-text">Unauthorized Access is Prohibited</p>
                    <br> <p class="login-footer">Already have an account? <a href="#" class="accent-blue">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
